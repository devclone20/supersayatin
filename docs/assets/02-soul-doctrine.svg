  <text x="849" y="294" font-size="11" fill="#566070">thesis break exits first</text>

  <text x="550" y="336" text-anchor="middle" font-size="11" fill="#566070">the two-key rule — macro alone never opens a position</text>

  <rect x="40" y="352" width="1020" height="130" rx="10" fill="#161b22" stroke="#f0a14a" stroke-opacity="0.45"/>
  <text x="64" y="382" font-size="14" font-weight="700" fill="#f0a14a">UNIFIED RISK DOCTRINE — the hard caps</text>

  <text x="64" y="410" font-size="12" fill="#f0a14a">✓</text>
  <text x="84" y="410" font-size="12" fill="#c9d1d9">max leverage 5x</text>
  <text x="64" y="432" font-size="12" fill="#f0a14a">✓</text>
  <text x="84" y="432" font-size="12" fill="#c9d1d9">portfolio heat 10% of equity</text>
  <text x="64" y="454" font-size="12" fill="#f0a14a">✓</text>
  <text x="84" y="454" font-size="12" fill="#c9d1d9">max 5 positions · 2 per sector</text>

  <text x="560" y="410" font-size="12" fill="#f0a14a">✓</text>
  <text x="580" y="410" font-size="12" fill="#c9d1d9">min risk to reward 3:1</text>
  <text x="560" y="432" font-size="12" fill="#f0a14a">✓</text>
  <text x="580" y="432" font-size="12" fill="#c9d1d9">max single position 30% notional</text>
  <text x="560" y="454" font-size="12" fill="#f0a14a">✗</text>
  <text x="580" y="454" font-size="12" fill="#c9d1d9">never add to a losing position</text>

  <text x="550" y="512" text-anchor="middle" font-size="13" fill="#8b949e">the transformation lives inside the cage — power scales, the caps never move</text>
