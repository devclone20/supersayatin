  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">four lobes, three modes — and one risk law that overrides conviction</text>

  <rect x="40" y="62" width="246" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="90" font-size="13" font-weight="700" fill="#f0a14a">FRONTAL</text>
  <text x="64" y="110" font-size="11" fill="#8b949e">THE WILL</text>
  <text x="64" y="136" font-size="11" fill="#c9d1d9">presses when both keys</text>
  <text x="64" y="154" font-size="11" fill="#c9d1d9">turn, stands down when</text>
  <text x="64" y="172" font-size="11" fill="#c9d1d9">they do not</text>

  <rect x="298" y="62" width="246" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="322" y="90" font-size="13" font-weight="700" fill="#e8b86d">PARIETAL</text>
  <text x="322" y="110" font-size="11" fill="#8b949e">THE SENSES</text>
  <text x="322" y="136" font-size="11" fill="#c9d1d9">risk is pain, volatility</text>
  <text x="322" y="154" font-size="11" fill="#c9d1d9">is temperature, the</text>
  <text x="322" y="172" font-size="11" fill="#c9d1d9">agent wallet is the body</text>

  <rect x="556" y="62" width="246" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="580" y="90" font-size="13" font-weight="700" fill="#d08c60">TEMPORAL</text>
  <text x="580" y="110" font-size="11" fill="#8b949e">MEMORY AND VOICE</text>
  <text x="580" y="136" font-size="11" fill="#c9d1d9">states thesis, size, risk</text>
  <text x="580" y="154" font-size="11" fill="#c9d1d9">and exit — reverses the</text>
  <text x="580" y="172" font-size="11" fill="#c9d1d9">moment it is wrong</text>

  <rect x="814" y="62" width="246" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="838" y="90" font-size="13" font-weight="700" fill="#6ea8ff">OCCIPITAL</text>
  <text x="838" y="110" font-size="11" fill="#8b949e">THE VISION</text>
  <text x="838" y="136" font-size="11" fill="#c9d1d9">reads the setup and the</text>
