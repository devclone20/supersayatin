  <path d="M552 261 L558 267 L552 273" fill="none" stroke="#566070" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="566" y="222" width="229" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="586" y="250" font-size="12" font-weight="700" fill="#f0a14a">3 · SIZE BY RISK</text>
  <text x="586" y="274" font-size="11" fill="#c9d1d9">stop is 2 · ATR(14)</text>
  <text x="586" y="294" font-size="11" fill="#566070">probe → confirm → jugular</text>

  <path d="M801 267 L821 267" stroke="#566070" stroke-width="2.5"/>
  <path d="M815 261 L821 267 L815 273" fill="none" stroke="#566070" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

