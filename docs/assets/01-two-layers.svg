      <stop offset="0" stop-color="#f0a14a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0a14a" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="480" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="477" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="472" width="1100" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <g stroke="#f0a14a" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#f0a14a"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#f0a14a"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#f0a14a"/>
  <path d="M107 27 Q111 30 115 27" stroke="#f0a14a" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">two layers over one soul — the interactive substrate and the deployed runtime</text>

  <rect x="40" y="62" width="505" height="214" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="92" font-size="14" font-weight="700" fill="#f0a14a">PI SUBSTRATE — interactive, BYOK</text>
  <text x="64" y="112" font-size="11" fill="#566070">.pi/ · soul/ · scripts/ · skills/ · identity.json</text>
  <line x1="64" y1="126" x2="521" y2="126" stroke="#30363d"/>
  <text x="64" y="152" font-size="12" fill="#c9d1d9">scripts/setup.sh — pins pi 0.80.10, no sudo</text>
  <text x="64" y="174" font-size="12" fill="#c9d1d9">pi then /login — your own model key, never shared</text>
  <text x="64" y="196" font-size="12" fill="#c9d1d9">scripts/boot.sh — pi -a, trusts .pi/ so the soul loads</text>
  <text x="64" y="230" font-size="11" fill="#8b949e">install-command.sh — type supersayatin in the iT terminal</text>
  <text x="64" y="252" font-size="11" fill="#566070">skills/cmux — panes, surfaces, browser control (MIT)</text>

  <rect x="555" y="62" width="505" height="214" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="579" y="92" font-size="14" font-weight="700" fill="#6ea8ff">ECONOMY RUNTIME — deployed</text>
  <text x="579" y="112" font-size="11" fill="#566070">apps/agent/ · infra/ops · infra/offerings · infra/supabase</text>
  <line x1="579" y1="126" x2="1036" y2="126" stroke="#30363d"/>
  <text x="579" y="152" font-size="12" fill="#c9d1d9">apps/agent/server.py — ACP provider loop</text>
  <text x="579" y="174" font-size="12" fill="#c9d1d9">infra/ops/bootstrapper.py — ACP client loop</text>
  <text x="579" y="196" font-size="12" fill="#c9d1d9">Virtuals ACP on Base · chain id 8453 · USDC</text>
  <text x="579" y="230" font-size="11" fill="#8b949e">already live — AGENTS.md says do not rebuild it</text>
  <text x="579" y="252" font-size="11" fill="#566070">launchd · systemd · watchdog · daily report</text>

  <path d="M292 276 L292 292" stroke="#566070" stroke-width="2.5"/>
  <path d="M286 286 L292 292 L298 286" fill="none" stroke="#566070" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M807 276 L807 292" stroke="#566070" stroke-width="2.5"/>
  <path d="M801 286 L807 292 L813 286" fill="none" stroke="#566070" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="40" y="296" width="1020" height="96" rx="10" fill="#161b22" stroke="#f0a14a" stroke-opacity="0.45"/>
  <text x="64" y="326" font-size="14" font-weight="700" fill="#f0a14a">ONE SOUL</text>
  <text x="64" y="352" font-size="12" fill="#c9d1d9">soul/neural_soul.md v1.0.0 · identity.json · .pi/APPEND_SYSTEM.md</text>
  <text x="64" y="374" font-size="11" fill="#566070">loaded at every session — four lobes · three modes · one risk law</text>
  <text x="1036" y="352" text-anchor="end" font-size="12" fill="#8b949e">whoever holds the token holds the agent</text>
  <text x="1036" y="374" text-anchor="end" font-size="11" fill="#566070">sealed at mint: soul · identity · manifest · art</text>

  <text x="550" y="424" text-anchor="middle" font-size="13" fill="#8b949e">the Pi overlay was added without touching the runtime or the neural soul</text>
</svg>
