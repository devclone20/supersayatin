<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a14a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0a14a" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="500" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="497" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="492" width="1100" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <g stroke="#f0a14a" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#f0a14a"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#f0a14a"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#f0a14a"/>
  <path d="M107 27 Q111 30 115 27" stroke="#f0a14a" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">the provider loop as implemented — events in, deliverable out, escrow released</text>

  <rect x="40" y="66" width="232" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="96" font-size="12" font-weight="700" fill="#f0a14a">1 · LISTEN</text>
  <text x="56" y="122" font-size="11" fill="#c9d1d9">acp events listen</text>
  <text x="56" y="142" font-size="11" fill="#566070">into iclone-events.jsonl</text>

  <path d="M278 114 L296 114" stroke="#566070" stroke-width="2.5"/>
  <path d="M290 108 L296 114 L290 120" fill="none" stroke="#566070" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="302" y="66" width="232" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="318" y="96" font-size="12" font-weight="700" fill="#f0a14a">2 · DRAIN</text>
  <text x="318" y="122" font-size="11" fill="#c9d1d9">acp events drain, every 5s</text>
  <text x="318" y="142" font-size="11" fill="#566070">routed by availableTools</text>

  <path d="M540 114 L558 114" stroke="#566070" stroke-width="2.5"/>
  <path d="M552 108 L558 114 L552 120" fill="none" stroke="#566070" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="564" y="66" width="232" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="580" y="96" font-size="12" font-weight="700" fill="#f0a14a">3 · EXECUTE</text>
  <text x="580" y="122" font-size="11" fill="#c9d1d9">provider set-budget, then</text>
  <text x="580" y="142" font-size="11" fill="#566070">execute_offering(id, req)</text>

  <path d="M802 114 L820 114" stroke="#566070" stroke-width="2.5"/>
  <path d="M814 108 L820 114 L814 120" fill="none" stroke="#566070" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="826" y="66" width="232" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="842" y="96" font-size="12" font-weight="700" fill="#f0a14a">4 · SETTLE</text>
  <text x="842" y="122" font-size="11" fill="#c9d1d9">acp provider submit</text>
  <text x="842" y="142" font-size="11" fill="#566070">client signs, USDC moves</text>

  <rect x="40" y="190" width="1020" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="216" font-size="11" fill="#566070">JobStatus — apps/agent/iclone/skills/acp_skill.py</text>
  <text x="64" y="244" font-size="12" fill="#c9d1d9">pending → accepted → executing → delivered → completed</text>
  <text x="1036" y="244" text-anchor="end" font-size="11" fill="#566070">terminal states: disputed · cancelled</text>

  <rect x="40" y="290" width="331" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="318" font-size="13" font-weight="700" fill="#f0a14a">ESCROW · ERC-8183</text>
  <text x="64" y="344" font-size="11" fill="#c9d1d9">USDC held on Base until the</text>
  <text x="64" y="364" font-size="11" fill="#c9d1d9">client or evaluator signs</text>
  <text x="64" y="388" font-size="11" fill="#566070">chain id 8453</text>

  <rect x="384" y="290" width="331" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="408" y="318" font-size="13" font-weight="700" fill="#e8b86d">DELIVERABLE MEMO</text>
  <text x="408" y="344" font-size="11" fill="#c9d1d9">job id · provider id · hash</text>
  <text x="408" y="364" font-size="11" fill="#c9d1d9">url · summary · timestamp</text>
  <text x="408" y="388" font-size="11" fill="#566070">the proof of work delivered</text>

  <rect x="728" y="290" width="331" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="752" y="318" font-size="13" font-weight="700" fill="#6ea8ff">REPUTATION · ERC-8004</text>
  <text x="752" y="344" font-size="11" fill="#c9d1d9">every completed job becomes</text>
  <text x="752" y="364" font-size="11" fill="#c9d1d9">portable on-chain history</text>
  <text x="752" y="388" font-size="11" fill="#566070">provider id: iclone-ai</text>

  <text x="550" y="440" text-anchor="middle" font-size="13" fill="#8b949e">no deliverable, no release — escrow is never opened without proof of delivery</text>
</svg>
